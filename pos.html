```html

  <!-- ============================================================
       RECEIPT MODAL

  <div
    id="receipt-overlay"
    style="

    "
  ></div>


  <div
    id="receipt-panel"
    class="card"
    style="
      display:none;

      top:5%;
      left:50%;

      width:92%;
      max-width:380px;
      z-index:70;
      max-height:88vh;
      overflow-y:auto;
    "
  >

    <div
      id="receipt-content"
      style="
        font-family:'Courier New', monospace;

      "
    ></div>


    <div
      style="
        display:flex;

      "

      <button

      >
        🖨️ Print
      </button>

      >
        📱 WhatsApp
      </button>

    </div>

  <!-- ============================================================
       JAVASCRIPT FILES
  ============================================================ -->

  <script src="js/offline-cache.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/offline-sync.js"></script>


  <script>

    // ============================================================
    // GLOBAL STATE
    // ============================================================

    let cart = [];
    let allProducts = [];
    let currentStaff = null;
    let lastReceiptData = null;
    let deptFilter = '';

    const HELD_SALES_KEY = 'appliance_pos_held_sales';


    // ============================================================
    // DEPARTMENT FILTER
    // ============================================================

    function setDeptFilter(dept, btnEl) {

      deptFilter = dept;

      document
        .querySelectorAll('.dept-tab')
        .forEach(btn => btn.classList.remove('active'));

      if (btnEl) {
        btnEl.classList.add('active');
      }

      applyProductFilters();
    }


    function applyProductFilters() {

      const searchInput =
        document.getElementById('product-search');

      const q =
        (searchInput?.value || '')
          .toLowerCase()
          .trim();


      const filtered =
        allProducts.filter(product => {

          const matchesDept =
            !deptFilter ||
            product.department === deptFilter;


          const productName =
            String(product.name || '')
              .toLowerCase();


          const category =
            String(product.category || '')
              .toLowerCase();


          const matchesSearch =
            productName.includes(q) ||
            category.includes(q);


          return matchesDept && matchesSearch;
        });


      renderProductList(filtered);
    }


    // ============================================================
    // LOW STOCK WARNING
    // ============================================================

    function updateLowStockBanner() {

      const banner =
        document.getElementById('low-stock-banner');


      if (!banner) return;


      const lowItems =
        allProducts.filter(product => {

          const stock =
            Number(product.stock_quantity ?? 0);


          const reorderLevel =
            Number(product.reorder_level ?? 2);


          return stock <= reorderLevel;
        });


      if (!lowItems.length) {

        banner.style.display = 'none';
        banner.innerHTML = '';

        return;
      }


      const names =
        lowItems
          .slice(0, 4)
          .map(product =>
            escapeHtml(product.name)
          )
          .join(', ');


      const extra =
        lowItems.length > 4
          ? ` and ${lowItems.length - 4} more`
          : '';


      banner.innerHTML =
        `⚠️ Low stock: ${names}${extra}`;


      banner.style.display = 'block';
    }


    // ============================================================
    // AUTH / INITIAL LOAD
    // ============================================================

    (async () => {

      try {

        currentStaff =
          await requireAuth([
            'admin',
            'manager',
            'cashier'
          ]);


        if (!currentStaff) return;


        document.getElementById('staff-name').textContent =
          `${currentStaff.full_name} (${currentStaff.role})`;


        renderNav(currentStaff.role);


        // Department-locked staff
        if (
          currentStaff.role !== 'admin' &&
          currentStaff.department
        ) {

          document.getElementById('dept-tabs').style.display =
            'none';

          deptFilter =
            currentStaff.department;
        }


        await loadProducts();

        renderHeldSales();

        renderCart();

      } catch (error) {

        console.error(
          'POS initialization failed:',
          error
        );

      }

    })();


    // ============================================================
    // NAVIGATION
    // ============================================================

    function renderNav(role) {

      const tabs = [
        {
          href: 'pos.html',
          label: 'POS'
        }
      ];


      if (role === 'admin') {

        tabs.push(
          {
            href: 'inventory.html',
            label: 'Inventory'
          },
          {
            href: 'dashboard.html',
            label: 'Dashboard'
          },
          {
            href: 'staff.html',
            label: 'Staff'
          },
          {
            href: 'reports.html',
            label: 'Reports'
          }
        );
      }


      document.getElementById('nav-tabs').innerHTML =
        tabs.map(tab => `
          <a
            href="${escapeHtml(tab.href)}"
            class="${tab.href === 'pos.html' ? 'active' : ''}"
          >
            ${escapeHtml(tab.label)}
          </a>
        `).join('');
    }


    // ============================================================
    // LOAD PRODUCTS
    // ============================================================

    async function loadProducts() {

      if (!navigator.onLine) {

        const cached =
          cacheGet('products_list');


        if (cached) {

          allProducts =
            Array.isArray(cached.data)
              ? cached.data
              : [];


          showOfflineBanner(
            cached.cachedAt
          );


          applyProductFilters();

          updateLowStockBanner();
        }

        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from('products')
          .select('*')
          .eq('is_active', true)
          .order('name');


      if (error) {

        console.error(
          'Product loading failed:',
          error
        );


        const cached =
          cacheGet('products_list');


        if (cached) {

          allProducts =
            Array.isArray(cached.data)
              ? cached.data
              : [];


          showOfflineBanner(
            cached.cachedAt
          );


          applyProductFilters();

          updateLowStockBanner();
        }

        return;
      }


      hideOfflineBanner();


      allProducts =
        Array.isArray(data)
          ? data
          : [];


      cacheSet(
        'products_list',
        allProducts
      );


      applyProductFilters();

      updateLowStockBanner();
    }


    // ============================================================
    // PRODUCT LIST
    // ============================================================

    function renderProductList(products) {

      const el =
        document.getElementById('product-list');


      if (!el) return;


      if (!products.length) {

        el.innerHTML =
          '<div class="empty-state">No products found.</div>';

        return;
      }


      el.innerHTML =
        products.map(product => {

          const stock =
            Number(product.stock_quantity ?? 0);


          const reorderLevel =
            Number(product.reorder_level ?? 2);


          const isLowStock =
            stock > 0 &&
            stock <= reorderLevel;


          const isOutOfStock =
            stock <= 0;


          const productId =
            String(product.id);


          return `
            <div
              class="card"
              style="
                margin-bottom:8px;
                padding:10px 14px;
                display:flex;
                justify-content:space-between;
                align-items:center;
              "
            >

              <div>

                <strong>
                  ${escapeHtml(product.name)}
                </strong>

                <div
                  style="
                    font-size:0.8rem;
                    color:var(--muted);
                  "
                >
                  ${escapeHtml(product.category || '')}
                  · Ksh ${Number(product.price || 0).toLocaleString()}
                  · ${stock} in stock

                  ${
                    isLowStock
                      ? ' · ⚠️ Low stock'
                      : ''
                  }

                  ${
                    isOutOfStock
                      ? ' · ❌ Out of stock'
                      : ''
                  }
                </div>

              </div>


              <button
                type="button"
                ${isOutOfStock ? 'disabled' : ''}
                data-product-id="${escapeHtml(productId)}"
                onclick="addToCart(this.dataset.productId)"
              >
                Add
              </button>

            </div>
          `;

        }).join('');
    }


    // ============================================================
    // PRODUCT SEARCH
    // ============================================================

    document
      .getElementById('product-search')
      .addEventListener(
        'input',
        applyProductFilters
      );


    // ============================================================
    // ADD TO CART
    // ============================================================

    function addToCart(productId) {

      console.log(
        'Add clicked:',
        productId
      );


      // Find product using string comparison.
      // This safely handles UUIDs and string IDs.
      const product =
        allProducts.find(
          p =>
            String(p.id) ===
            String(productId)
        );


      if (!product) {

        console.error(
          'Product not found:',
          productId
        );


        alert(
          'Unable to add this product. Please refresh the POS.'
        );


        return;
      }


      // Current stock
      const stock =
        Number(
          product.stock_quantity ?? 0
        );


      // Prevent adding products with no stock
      if (stock <= 0) {

        alert(
          `❌ ${product.name} is out of stock.`
        );


        return;
      }


      // Check whether product already exists in cart
      const existing =
        cart.find(
          item =>
            String(item.product.id) ===
            String(productId)
        );


      const currentCartQty =
        existing
          ? Number(existing.quantity)
          : 0;


      // Never allow cart quantity to exceed stock
      if (
        currentCartQty >= stock
      ) {

        alert(
          `Not enough stock available. Only ${stock} item(s) left.`
        );


        return;
      }


      // Increase quantity if already in cart
      if (existing) {

        existing.quantity += 1;

      }

      // Otherwise add product to cart
      else {

        cart.push({
          product: product,
          quantity: 1
        });

      }


      // Update cart display
      renderCart();


      console.log(
        'Cart updated:',
        cart
      );
    }


    // ============================================================
    // CHANGE QUANTITY
    // ============================================================

    function changeQuantity(index, delta) {

      const item =
        cart[index];


      if (!item) return;


      const newQty =
        item.quantity + delta;


      if (newQty <= 0) {

        cart.splice(index, 1);

        renderCart();

        return;
      }


      const stock =
        Number(
          item.product.stock_quantity ?? 0
        );


      if (newQty > stock) {

        alert(
          `Not enough stock available. Only ${stock} item(s) left.`
        );


        return;
      }


      item.quantity =
        newQty;


      renderCart();
    }


    // ============================================================
    // CART TOTALS
    // ============================================================

    function getSubtotal() {

      return cart.reduce(
        (sum, item) =>
          sum +
          Number(item.product.price || 0) *
          item.quantity,
        0
      );
    }


    function getDiscount() {

      const input =
        document.getElementById(
          'discount-amount'
        );


      const val =
        parseFloat(
          input.value
        );


      return isNaN(val) || val < 0
        ? 0
        : val;
    }


    function getMarkup() {

      const input =
        document.getElementById(
          'markup-amount'
        );


      const val =
        parseFloat(
          input.value
        );


      return isNaN(val) || val < 0
        ? 0
        : val;
    }


    // ============================================================
    // RENDER CART
    // ============================================================

    function renderCart() {

      const el =
        document.getElementById(
          'cart-items'
        );


      if (!cart.length) {

        el.innerHTML =
          '<div class="empty-state">Cart is empty</div>';

      } else {

        el.innerHTML =
          cart.map((item, i) => `

            <div
              style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                padding:6px 0;
                border-bottom:1px solid var(--border);
              "
            >

              <div>

                <div
                  style="
                    font-weight:600;
                    font-size:0.9rem;
                  "
                >
                  ${escapeHtml(item.product.name)}
                </div>

                <div
                  style="
                    font-size:0.75rem;
                    color:var(--muted);
                  "
                >
                  Ksh ${Number(
                    item.product.price || 0
                  ).toLocaleString()} each
                </div>

              </div>


              <div
                style="
                  display:flex;
                  align-items:center;
                  gap:8px;
                "
              >

                <button
                  type="button"
                  class="secondary"
                  style="padding:2px 8px;"
                  onclick="changeQuantity(${i}, -1)"
                >
                  −
                </button>


                <span>
                  ${item.quantity}
                </span>


                <button
                  type="button"
                  class="secondary"
                  style="padding:2px 8px;"
                  onclick="changeQuantity(${i}, 1)"
                >
                  +
                </button>

              </div>

            </div>

          `).join('');
      }


      updateTotals();
    }


    // ============================================================
    // UPDATE TOTALS
    // ============================================================

    function updateTotals() {

      const subtotal =
        getSubtotal();


      const discount =
        Math.min(
          getDiscount(),
          subtotal
        );


      const markup =
        getMarkup();


      const total =
        Math.max(
          0,
          subtotal -
          discount +
          markup
        );


      document.getElementById(
        'cart-subtotal'
      ).textContent =
        `Ksh ${subtotal.toLocaleString()}`;


      document.getElementById(
        'cart-discount'
      ).textContent =
        `− Ksh ${discount.toLocaleString()}`;


      document.getElementById(
        'cart-markup'
      ).textContent =
        `+ Ksh ${markup.toLocaleString()}`;


      document.getElementById(
        'cart-total'
      ).textContent =
        `Ksh ${total.toLocaleString()}`;
    }


    document
      .getElementById('discount-amount')
      .addEventListener(
        'input',
        updateTotals
      );


    document
      .getElementById('markup-amount')
      .addEventListener(
        'input',
        updateTotals
      );


    // ============================================================
    // HOLD / RESUME SALES
    // ============================================================

    function getHeldSales() {

      try {

        return JSON.parse(
          localStorage.getItem(
            HELD_SALES_KEY
          )
        ) || [];

      } catch (error) {

        console.error(
          'Unable to read held sales:',
          error
        );


        return [];
      }
    }


    function saveHeldSales(list) {

      localStorage.setItem(
        HELD_SALES_KEY,
        JSON.stringify(list)
      );
    }


    function holdSale() {

      if (!cart.length) {

        alert(
          'Cart is empty — nothing to hold.'
        );


        return;
      }


      const label =
        prompt(
          'Label this held sale (e.g. customer name):',
          document.getElementById(
            'customer-name'
          ).value || 'Held sale'
        );


      if (label === null) return;


      const held =
        getHeldSales();


      held.push({

        id: Date.now(),

        label,

        cart:
          cart.map(item => ({
            productId:
              item.product.id,

            quantity:
              item.quantity
          })),

        discount:
          getDiscount(),

        markup:
          getMarkup(),

        customerName:
          document.getElementById(
            'customer-name'
          ).value,

        customerPhone:
          document.getElementById(
            'customer-phone'
          ).value,

        heldAt:
          new Date().toISOString()

      });


      saveHeldSales(
        held
      );


      cart = [];


      document.getElementById(
        'discount-amount'
      ).value = 0;


      document.getElementById(
        'markup-amount'
      ).value = 0;


      document.getElementById(
        'customer-name'
      ).value = '';


      document.getElementById(
        'customer-phone'
      ).value = '';


      renderCart();

      renderHeldSales();
    }


    function renderHeldSales() {

      const held =
        getHeldSales();


      const el =
        document.getElementById(
          'held-sales-list'
        );


      if (!held.length) {

        el.innerHTML =
          '<div class="empty-state" style="padding:12px;">No held sales</div>';

        return;
      }


      el.innerHTML =
        held.map(h => `

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              padding:8px 0;
              border-bottom:1px solid var(--border);
              font-size:0.85rem;
            "
          >

            <div>

              <strong>
                ${escapeHtml(h.label)}
              </strong>

              <div
                style="
                  color:var(--muted);
                  font-size:0.75rem;
                "
              >
                ${h.cart.length} item(s)
              </div>

            </div>


            <div
              style="
                display:flex;
                gap:6px;
              "
            >

              <button
                type="button"
                class="secondary"
                style="
                  padding:4px 8px;
                  font-size:0.75rem;
                "
                onclick="resumeSale(${h.id})"
              >
                Resume
              </button>


              <button
                type="button"
                class="danger"
                style="
                  padding:4px 8px;
                  font-size:0.75rem;
                "
                onclick="discardHeldSale(${h.id})"
              >
                ✕
              </button>

            </div>

          </div>

        `).join('');
    }


    function resumeSale(holdId) {

      if (
        cart.length &&
        !confirm(
          'This will replace your current cart. Continue?'
        )
      ) {
        return;
      }


      const held =
        getHeldSales();


      const entry =
        held.find(
          h => h.id === holdId
        );


      if (!entry) return;


      cart =
        entry.cart
          .map(ci => {

            const product =
              allProducts.find(
                p =>
                  String(p.id) ===
                  String(ci.productId)
              );


            return product
              ? {
                  product,
                  quantity: ci.quantity
                }
              : null;

          })
          .filter(Boolean);


      document.getElementById(
        'discount-amount'
      ).value =
        entry.discount || 0;


      document.getElementById(
        'markup-amount'
      ).value =
        entry.markup || 0;


      document.getElementById(
        'customer-name'
      ).value =
        entry.customerName || '';


      document.getElementById(
        'customer-phone'
      ).value =
        entry.customerPhone || '';


      saveHeldSales(
        held.filter(
          h => h.id !== holdId
        )
      );


      renderCart();

      renderHeldSales();
    }


    function discardHeldSale(holdId) {

      if (
        !confirm(
          'Discard this held sale?'
        )
      ) {
        return;
      }


      saveHeldSales(
        getHeldSales().filter(
          h => h.id !== holdId
        )
      );


      renderHeldSales();
    }


    // ============================================================
    // CHECKOUT
    // ============================================================

    async function checkout() {

      const errorEl =
        document.getElementById(
          'checkout-error'
        );


      errorEl.style.display =
        'none';


      if (!cart.length) {

        errorEl.textContent =
          'Cart is empty.';

        errorEl.style.display =
          'block';

        return;
      }


      const btn =
        document.getElementById(
          'checkout-btn'
        );


      btn.disabled =
        true;


      btn.textContent =
        'Processing...';


      const subtotal =
        getSubtotal();


      const discount =
        Math.min(
          getDiscount(),
          subtotal
        );


      const markup =
        getMarkup();


      const total =
        Math.max(
          0,
          subtotal -
          discount +
          markup
        );


      const paymentMethod =
        document.getElementById(
          'payment-method'
        ).value;


      const customerName =
        document.getElementById(
          'customer-name'
        ).value.trim() || null;


      const customerPhone =
        document.getElementById(
          'customer-phone'
        ).value.trim() || null;


      const saleData = {

        cashier_id:
          currentStaff.id,

        customer_name:
          customerName,

        customer_phone:
          customerPhone,

        payment_method:
          paymentMethod,

        total_amount:
          total,

        subtotal_amount:
          subtotal,

        discount_amount:
          discount,

        markup_amount:
          markup,

        status:
          'completed',

        items:
          cart.map(item => ({

            product_id:
              item.product.id,

            unit_price:
              item.product.price,

            quantity:
              item.quantity

          }))

      };


      const receiptItems =
        cart.map(item => ({

          name:
            item.product.name,

          quantity:
            item.quantity,

          price:
            item.product.price

        }));


      try {

        if (!navigator.onLine) {
          throw new Error('offline');
        }


        const {
          items,
          ...saleFields
        } = saleData;


        // INSERT SALE
        const {
          data: insertedSale,
          error: saleError
        } =
          await supabaseClient
            .from('sales')
            .insert(saleFields)
            .select()
            .single();


        if (saleError) {
          throw saleError;
        }


        // INSERT SALE ITEMS
        const itemsToInsert =
          items.map(item => ({
            ...item,
            sale_id:
              insertedSale.id
          }));


        const {
          error: itemsError
        } =
          await supabaseClient
            .from('sale_items')
            .insert(itemsToInsert);


        if (itemsError) {
          throw itemsError;
        }


        // UPDATE STOCK
        for (const item of items) {

          const product =
            allProducts.find(
              p =>
                String(p.id) ===
                String(item.product_id)
            );


          if (!product) continue;


          const currentStock =
            Number(
              product.stock_quantity ?? 0
            );


          const newQty =
            Math.max(
              0,
              currentStock -
              item.quantity
            );


          const {
            error: stockError
          } =
            await supabaseClient
              .from('products')
              .update({
                stock_quantity:
                  newQty
              })
              .eq(
                'id',
                item.product_id
              );


          if (stockError) {

            console.error(
              'Stock update failed:',
              stockError
            );

          }
        }


        showReceipt({

          items:
            receiptItems,

          subtotal,

          discount,

          markup,

          total,

          paymentMethod,

          customerName,

          customerPhone,

          date:
            new Date()

        });


      } catch (err) {

        console.warn(
          'Online checkout failed, queueing offline:',
          err
        );


        await queueSaleOffline(
          saleData
        );


        showReceipt({

          items:
            receiptItems,

          subtotal,

          discount,

          markup,

          total,

          paymentMethod,

          customerName,

          customerPhone,

          date:
            new Date(),

          offline:
            true

        });


        const pending =
          await getPendingSales();


        updateSyncBadge(
          pending.length
        );
      }


      // CLEAR CART
      cart = [];


      renderCart();


      document.getElementById(
        'discount-amount'
      ).value = 0;


      document.getElementById(
        'markup-amount'
      ).value = 0;


      document.getElementById(
        'customer-name'
      ).value = '';


      document.getElementById(
        'customer-phone'
      ).value = '';


      btn.disabled =
        false;


      btn.textContent =
        'Complete Sale';


      await loadProducts();
    }


    // ============================================================
    // RECEIPT
    // ============================================================

    function closeReceipt() {

        'receipt-overlay'

        'none';


      document.getElementById(
        'receipt-panel'
      ).style.display =
        'none';
    }


    // ============================================================
    // PRINT RECEIPT
    // ============================================================

    function printReceipt() {

      const content =
        document.getElementById(
          'receipt-content'
        ).innerHTML;


      const printWindow =
        window.open(
          '',
          '_blank'
        );


      if (!printWindow) {

        alert(
          'Please allow pop-ups to print the receipt.'
        );


        return;
      }


      printWindow.document.write(`

        <html>

        <head>

          <title>Receipt</title>

          <style>

            body {
              font-family:'Courier New', monospace;
              font-size:13px;
              padding:20px;
            }

          </style>

        </head>

        <body>

          ${content}

        </body>

        </html>

      `);


      printWindow.document.close();

      printWindow.focus();

      printWindow.print();
    }


    // ============================================================
    // WHATSAPP RECEIPT
    // ============================================================

    function shareReceiptWhatsapp() {

      if (!lastReceiptData) return;


      const data =
        lastReceiptData;


      const lines =
        data.items
          .map(item =>
            `${item.name} x${item.quantity} - Ksh ${(
              Number(item.price) *
              item.quantity
            ).toLocaleString()}`
          )
          .join('\n');


      let text =
        `*Thuku Enterprise Receipt*\n` +
        `${data.date.toLocaleString('en-KE')}\n\n` +
        `${lines}\n\n` +
        `Subtotal: Ksh ${data.subtotal.toLocaleString()}`;


      if (data.discount > 0) {

        text +=
          `\nDiscount: -Ksh ${data.discount.toLocaleString()}`;
      }


      if (data.markup > 0) {

        text +=
          `\nMarkup: +Ksh ${data.markup.toLocaleString()}`;
      }


      text +=
        `\n*TOTAL: Ksh ${data.total.toLocaleString()}*` +
        `\n\nThank you for your business!`;


      const phone =
        data.customerPhone
          ? data.customerPhone.replace(/\D/g, '')
          : '';


      let normalizedPhone =
        phone;


      // Convert Kenyan 07XXXXXXXX / 01XXXXXXXX
      // to international 254XXXXXXXXX
      if (
        normalizedPhone.startsWith('0') &&
        normalizedPhone.length === 10
      ) {

        normalizedPhone =
          '254' +
          normalizedPhone.slice(1);
      }


      const waUrl =
        normalizedPhone
          ? `https://wa.me/${normalizedPhone}?text=${encodeURIComponent(text)}`
          : `https://wa.me/?text=${encodeURIComponent(text)}`;


      window.open(
        waUrl,
        '_blank'
      );
    }


    // ============================================================
    // HTML ESCAPE
    // ============================================================

    function escapeHtml(str) {

      const div =
        document.createElement('div');


      div.textContent =
        str ?? '';


      return div.innerHTML;
    }

  </script>
