<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>POS — Thuku Enterprise</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f2137">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    #product-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      align-content: start;
    }
    #product-list .card {
      margin-bottom: 0;
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- ============================================================
       TOP BAR
  ============================================================ -->
  <div class="topbar">
    <h1>🛒 Point of Sale</h1>

    <div style="display:flex;align-items:center;gap:12px;">
      <span id="sync-badge"></span>

      <span class="role-tag" id="staff-name">...</span>

      <button
        type="button"
        class="secondary"
        onclick="logout()"
        style="color:#fff;border-color:#3a5169;"
      >
        Logout
      </button>
    </div>
  </div>


  <!-- ============================================================
       MAIN
  ============================================================ -->
  <div class="container">

    <div class="nav-tabs" id="nav-tabs"></div>

    <div
      class="grid"
      style="grid-template-columns:1.3fr 1fr;"
    >

      <!-- ========================================================
           PRODUCTS
      ======================================================== -->
      <div class="card">

        <!-- ======================================================
             LOW STOCK ALERT
        ====================================================== -->
        <div
          id="low-stock-banner"
          role="alert"
          aria-live="polite"
          style="
            display:none;
            background:#fff3cd;
            color:#7a4b00;
            border:2px solid #f0ad00;
            border-radius:10px;
            padding:12px 14px;
            font-size:0.9rem;
            margin-bottom:12px;
            font-weight:600;
            line-height:1.45;
            box-shadow:0 2px 6px rgba(0,0,0,0.08);
          "
        ></div>


        <!-- DEPARTMENT TABS -->
        <div
          id="dept-tabs"
          style="
            display:flex;
            gap:8px;
            margin-bottom:12px;
          "
        >

          <button
            type="button"
            class="dept-tab active"
            data-dept=""
            onclick="setDeptFilter('', this)"
            style="flex:1;"
          >
            All
          </button>

          <button
            type="button"
            class="dept-tab"
            data-dept="Household Items"
            onclick="setDeptFilter('Household Items', this)"
            style="flex:1;"
          >
            Household
          </button>

          <button
            type="button"
            class="dept-tab"
            data-dept="Clothes & Shoes"
            onclick="setDeptFilter('Clothes & Shoes', this)"
            style="flex:1;"
          >
            Clothes & Shoes
          </button>

        </div>


        <!-- SEARCH -->
        <div class="field">
          <label for="product-search">
            Search product
          </label>

          <div style="display:flex; gap:8px;">
            <input
              type="text"
              id="product-search"
              placeholder="Type name, or scan a barcode..."
              autocomplete="off"
              style="flex:1; min-width:0;"
            >
            <button
              type="button"
              id="scan-btn"
              onclick="openCameraScanner()"
              title="Scan with camera"
              style="white-space:nowrap;"
            >📷 Scan</button>
          </div>
        </div>


        <!-- PRODUCT LIST -->
        <div
          id="product-list"
        ></div>

      </div>


      <!-- ========================================================
           CURRENT SALE
      ======================================================== -->
      <div class="card">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
          "
        >

          <h3 style="margin:0;">
            Current Sale
          </h3>

          <button
            type="button"
            class="secondary"
            style="padding:6px 10px;font-size:0.8rem;"
            onclick="holdSale()"
          >
            Hold Sale
          </button>

        </div>


        <!-- CART -->
        <div id="cart-items"></div>


        <!-- DISCOUNT / MARKUP -->
        <div
          class="grid grid-2"
          style="margin-top:10px;"
        >

          <div class="field">

            <label for="discount-amount">
              Discount (Ksh)
            </label>

            <input
              type="number"
              id="discount-amount"
              min="0"
              step="0.01"
              placeholder="0"
              value="0"
            >

          </div>


          <div class="field">

            <label for="markup-amount">
              Markup (Ksh)
            </label>

            <input
              type="number"
              id="markup-amount"
              min="0"
              step="0.01"
              placeholder="0"
              value="0"
            >

          </div>

        </div>


        <p
          style="
            font-size:0.75rem;
            color:var(--muted);
            margin-top:-8px;
          "
        >
          Use Discount if selling below listed price,
          or Markup if selling above it.
        </p>


        <!-- TOTALS -->
        <div
          style="
            border-top:1px solid var(--border);
            margin-top:10px;
            padding-top:10px;
          "
        >

          <div
            style="
              display:flex;
              justify-content:space-between;
              font-size:0.9rem;
              color:var(--muted);
            "
          >
            <span>Subtotal</span>
            <span id="cart-subtotal">Ksh 0</span>
          </div>


          <div
            style="
              display:flex;
              justify-content:space-between;
              font-size:0.9rem;
              color:var(--muted);
            "
          >
            <span>Discount</span>
            <span id="cart-discount">− Ksh 0</span>
          </div>


          <div
            style="
              display:flex;
              justify-content:space-between;
              font-size:0.9rem;
              color:var(--muted);
            "
          >
            <span>Markup</span>
            <span id="cart-markup">+ Ksh 0</span>
          </div>


          <div
            style="
              display:flex;
              justify-content:space-between;
              font-weight:700;
              font-size:1.1rem;
              margin-top:4px;
            "
          >
            <span>Total</span>
            <span id="cart-total">Ksh 0</span>
          </div>

        </div>


        <!-- CUSTOMER -->
        <div
          class="field"
          style="margin-top:14px;"
        >

          <label for="customer-name">
            Customer name (optional)
          </label>

          <input
            type="text"
            id="customer-name"
            placeholder="Walk-in customer"
          >

        </div>


        <div class="field">

          <label for="customer-phone">
            Customer phone (optional)
          </label>

          <input
            type="tel"
            id="customer-phone"
            placeholder="07XXXXXXXX"
          >

        </div>


        <!-- PAYMENT -->
        <div class="field">

          <label for="payment-method">
            Payment method
          </label>

          <select id="payment-method">
            <option value="paybill_stk">M-Pesa Paybill — send prompt to customer</option>
            <option value="paybill_code">M-Pesa Paybill — customer already paid (enter code)</option>
            <option value="pochi_code">Pochi la Biashara (enter code)</option>
            <option value="cash">Cash</option>
            <option value="card">Card</option>
          </select>

        </div>


        <!-- CHECKOUT -->
        <button
          type="button"
          id="checkout-btn"
          style="width:100%;"
          onclick="checkout()"
        >
          Complete Sale
        </button>


        <p
          class="error-text"
          id="checkout-error"
          style="display:none;"
        ></p>


        <!-- HELD SALES -->
        <div
          style="
            border-top:1px solid var(--border);
            margin-top:14px;
            padding-top:14px;
          "
        >

          <h3 style="margin:0;">
            Held Sales
          </h3>

          <div
            id="held-sales-list"
            style="margin-top:8px;"
          ></div>

        </div>

      </div>

    </div>
  </div>


  <!-- ============================================================
       RECEIPT
  ============================================================ -->

  <div
    id="receipt-overlay"
    style="
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      z-index:60;
    "
    onclick="closeReceipt()"
  ></div>


  <div
    id="receipt-panel"
    class="card"
    style="
      display:none;
      position:fixed;
      top:5%;
      left:50%;
      transform:translateX(-50%);
      width:92%;
      max-width:380px;
      z-index:70;
      max-height:88vh;
      overflow-y:auto;
    "
  >

    <div
      id="receipt-content"
      style="
        font-family:'Courier New',monospace;
        font-size:0.85rem;
        line-height:1.5;
      "
    ></div>


    <div
      style="
        display:flex;
        gap:8px;
        margin-top:16px;
      "
    >

      <button
        type="button"
        style="flex:1;"
        onclick="printReceipt()"
      >
        🖨️ Print
      </button>

      <button
        type="button"
        class="gold"
        style="flex:1;"
        onclick="shareReceiptWhatsapp()"
      >
        📱 WhatsApp
      </button>

    </div>


    <button
      type="button"
      class="secondary"
      style="width:100%;margin-top:8px;"
      onclick="closeReceipt()"
    >
      Close
    </button>

  </div>


  <!-- ============================================================
       M-PESA PAYMENT DIALOG (Paybill prompt / Pochi code entry)
  ============================================================ -->

  <div
    id="pay-overlay"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:80;"
  ></div>

  <div
    id="pay-panel"
    class="card"
    style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); width:92%; max-width:380px; z-index:90; max-height:80vh; overflow-y:auto;"
  >
    <h3 id="pay-title" style="margin-top:0;"></h3>
    <p id="pay-msg" style="font-size:0.9rem; line-height:1.45;"></p>

    <div id="pay-code-box" style="display:none;">
      <input
        type="text"
        id="pay-code"
        maxlength="10"
        autocomplete="off"
        autocapitalize="characters"
        placeholder="e.g. UI12ABC345"
        style="text-transform:uppercase; letter-spacing:1px;"
      >
    </div>

    <p id="pay-error" class="error-text" style="display:none;"></p>
    <div id="pay-actions" style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;"></div>
  </div>


  <!-- ============================================================
       JAVASCRIPT FILES
  ============================================================ -->

  <script src="js/offline-cache.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/offline-sync.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/payment-messages.js"></script>


  <script>

    /* ============================================================
       GLOBAL STATE
    ============================================================ */

    let cart = [];
    let allProducts = [];
    let currentStaff = null;
    let lastReceiptData = null;
    let deptFilter = '';

    const HELD_SALES_KEY =
      'appliance_pos_held_sales';

    /*
     * IMPORTANT:
     * Products with stock AT OR BELOW 5 are considered low stock.
     */
    const LOW_STOCK_LIMIT = 5;


    /* ============================================================
       SAFE NUMBER
    ============================================================ */

    function safeNumber(value, fallback = 0) {

      const number = Number(value);

      return Number.isFinite(number)
        ? number
        : fallback;
    }


    /* ============================================================
       DEPARTMENT FILTER
    ============================================================ */

    function setDeptFilter(dept, btnEl) {

      deptFilter = dept || '';

      document
        .querySelectorAll('.dept-tab')
        .forEach(btn => {
          btn.classList.remove('active');
        });

      if (btnEl) {
        btnEl.classList.add('active');
      }

      applyProductFilters();
    }


    function applyProductFilters() {

      const searchInput =
        document.getElementById('product-search');

      const q =
        String(searchInput?.value || '')
          .toLowerCase()
          .trim();


      const filtered =
        allProducts.filter(product => {

          const productDepartment =
            String(product.department || '').trim();


          const matchesDept =
            !deptFilter ||
            productDepartment ===
              String(deptFilter).trim();


          const productName =
            String(product.name || '')
              .toLowerCase();


          const category =
            String(product.category || '')
              .toLowerCase();


          const barcode =
            String(product.barcode || '')
              .toLowerCase();


          const matchesSearch =
            !q ||
            productName.includes(q) ||
            category.includes(q) ||
            barcode.includes(q);


          return matchesDept && matchesSearch;
        });


      renderProductList(filtered);

      /*
       * IMPORTANT:
       * Always refresh the low-stock message whenever
       * the product list is refreshed.
       */
      updateLowStockBanner();
    }


    /* ============================================================
       LOW STOCK ALERT
    ============================================================ */

    function updateLowStockBanner() {

      const banner =
        document.getElementById(
          'low-stock-banner'
        );


      if (!banner) {
        return;
      }


      /*
       * ONLY use stock_quantity.
       *
       * Any product with:
       * 5, 4, 3, 2, 1 or 0
       * will trigger the alert.
       */
      const lowItems =
        allProducts.filter(product => {

          const stock =
            Number(product.stock_quantity);

          return (
            Number.isFinite(stock) &&
            stock <= LOW_STOCK_LIMIT
          );
        });


      /*
       * No low-stock products.
       */
      if (lowItems.length === 0) {

        banner.style.display = 'none';
        banner.innerHTML = '';

        return;
      }


      /*
       * Separate out-of-stock products.
       */
      const outOfStock =
        lowItems.filter(product =>
          safeNumber(
            product.stock_quantity,
            0
          ) <= 0
        );


      /*
       * Products that are low but still have stock.
       */
      const lowButAvailable =
        lowItems.filter(product =>
          safeNumber(
            product.stock_quantity,
            0
          ) > 0
        );


      let html = `
        <div style="
          font-size:1rem;
          font-weight:800;
          margin-bottom:6px;
        ">
          ⚠️ LOW STOCK ALERT
        </div>

        <div style="
          font-size:0.85rem;
          margin-bottom:8px;
        ">
          Please inform the owner about these products:
        </div>
      `;


      /*
       * Low stock products.
       */
      if (lowButAvailable.length) {

        html += `
          <div style="
            margin-bottom:5px;
          ">
            <strong>Low stock:</strong>
            ${lowButAvailable
              .map(product => {

                const name =
                  escapeHtml(
                    product.name ||
                    'Unnamed product'
                  );

                const stock =
                  safeNumber(
                    product.stock_quantity,
                    0
                  );

                return `
                  <span style="
                    display:inline-block;
                    margin:2px 4px 2px 0;
                    padding:2px 7px;
                    background:#ffe08a;
                    border-radius:5px;
                  ">
                    ${name} (${stock} left)
                  </span>
                `;

              })
              .join('')}
          </div>
        `;
      }


      /*
       * Out of stock products.
       */
      if (outOfStock.length) {

        html += `
          <div style="
            margin-top:6px;
            color:#b42318;
          ">
            <strong>❌ Out of stock:</strong>
            ${outOfStock
              .map(product => {

                return `
                  <span style="
                    display:inline-block;
                    margin:2px 4px 2px 0;
                    padding:2px 7px;
                    background:#ffd6d6;
                    border-radius:5px;
                  ">
                    ${escapeHtml(
                      product.name ||
                      'Unnamed product'
                    )}
                  </span>
                `;

              })
              .join('')}
          </div>
        `;
      }


      /*
       * Show banner.
       */
      banner.innerHTML = html;

      banner.style.display = 'block';
    }


    /* ============================================================
       AUTH / INITIALIZATION
    ============================================================ */

    (async function initPOS() {

      try {

        currentStaff =
          await requireAuth([
            'admin',
            'manager',
            'cashier'
          ]);


        if (!currentStaff) {
          return;
        }


        const staffName =
          document.getElementById(
            'staff-name'
          );


        if (staffName) {

          staffName.textContent =
            `${currentStaff.full_name || 'Staff'} (${currentStaff.role})`;
        }


        renderNav(currentStaff.role);


        /*
         * Department-locked staff.
         */
        if (
          currentStaff.role !== 'admin' &&
          currentStaff.department
        ) {

          const deptTabs =
            document.getElementById(
              'dept-tabs'
            );


          if (deptTabs) {
            deptTabs.style.display = 'none';
          }


          deptFilter =
            String(
              currentStaff.department
            ).trim();
        }


        await loadProducts();

        renderHeldSales();

        renderCart();

        /*
         * Final low-stock check after
         * everything has loaded.
         */
        updateLowStockBanner();

      } catch (error) {

        console.error(
          'POS initialization failed:',
          error
        );

      }

    })();


    /* ============================================================
       NAVIGATION
    ============================================================ */

    function renderNav(role) {

      const tabs = [
        {
          href: 'pos.html',
          label: 'POS'
        }
      ];


      if (role === 'admin') {

        tabs.push(
          {
            href: 'inventory.html',
            label: 'Inventory'
          },
          {
            href: 'dashboard.html',
            label: 'Dashboard'
          },
          {
            href: 'staff.html',
            label: 'Staff'
          },
          {
            href: 'reports.html',
            label: 'Reports'
          }
        );
      }


      const nav =
        document.getElementById(
          'nav-tabs'
        );


      if (!nav) {
        return;
      }


      nav.innerHTML =
        tabs.map(tab => `
          <a
            href="${escapeHtml(tab.href)}"
            class="${
              tab.href === 'pos.html'
                ? 'active'
                : ''
            }"
          >
            ${escapeHtml(tab.label)}
          </a>
        `).join('');
    }


    /* ============================================================
       LOAD PRODUCTS
    ============================================================ */

    async function loadProducts() {

      /*
       * Offline mode.
       */
      if (!navigator.onLine) {

        const cached =
          cacheGet('products_list');


        if (cached) {

          allProducts =
            Array.isArray(cached.data)
              ? cached.data
              : [];


          showOfflineBanner(
            cached.cachedAt
          );


          applyProductFilters();

          updateLowStockBanner();
        }

        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from('products')
            .select('*')
            .eq('is_active', true)
            .order('name');


        if (error) {
          throw error;
        }


        hideOfflineBanner();


        allProducts =
          Array.isArray(data)
            ? data
            : [];


        console.log(
          'POS products loaded:',
          allProducts
        );


        /*
         * Save latest product data.
         */
        cacheSet(
          'products_list',
          allProducts
        );


        /*
         * Render products and LOW STOCK alert.
         */
        applyProductFilters();

        updateLowStockBanner();

      } catch (error) {

        console.error(
          'Product loading failed:',
          error
        );


        const cached =
          cacheGet('products_list');


        if (cached) {

          allProducts =
            Array.isArray(cached.data)
              ? cached.data
              : [];


          showOfflineBanner(
            cached.cachedAt
          );


          applyProductFilters();

          updateLowStockBanner();

        } else {

          /*
           * Make sure the alert is hidden
           * if there is no product data.
           */
          allProducts = [];

          applyProductFilters();
          updateLowStockBanner();
        }
      }
    }


    /* ============================================================
       PRODUCT LIST
    ============================================================ */

    function renderProductList(products) {

      const el =
        document.getElementById(
          'product-list'
        );


      if (!el) {
        return;
      }


      if (!products.length) {

        el.innerHTML =
          '<div class="empty-state">No products found.</div>';

        return;
      }


      el.innerHTML =
        products.map(product => {

          const stock =
            safeNumber(
              product.stock_quantity,
              0
            );


          /*
           * LOW STOCK = 5 or less.
           */
          const isLowStock =
            stock > 0 &&
            stock <= LOW_STOCK_LIMIT;


          const isOutOfStock =
            stock <= 0;


          const productId =
            String(product.id);


          const price =
            safeNumber(
              product.price,
              0
            );


          return `
            <div
              class="card"
              style="
                margin-bottom:8px;
                padding:10px 14px;
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
              "
            >

              <div style="min-width:0;">

                <strong>
                  ${escapeHtml(
                    product.name ||
                    'Unnamed product'
                  )}
                </strong>

                <div
                  style="
                    font-size:0.8rem;
                    color:var(--muted);
                  "
                >
                  ${escapeHtml(
                    product.category || ''
                  )}

                  · Ksh ${price.toLocaleString()}

                  · ${stock} in stock

                  ${
                    isLowStock
                      ? ' · ⚠️ LOW STOCK'
                      : ''
                  }

                  ${
                    isOutOfStock
                      ? ' · ❌ OUT OF STOCK'
                      : ''
                  }
                </div>

              </div>


              <button
                type="button"
                ${isOutOfStock ? 'disabled' : ''}
                data-product-id="${escapeHtml(productId)}"
                onclick="addToCart(this.dataset.productId)"
              >
                Add
              </button>

            </div>
          `;

        }).join('');
    }


    /* ============================================================
       SEARCH
    ============================================================ */

    document
      .getElementById('product-search')
      .addEventListener(
        'input',
        applyProductFilters
      );


    /* ============================================================
       BARCODE SCANNING
       - USB / Bluetooth scanners: just scan (works when the page
         or the search box has focus)
       - Phone camera: "📷 Scan" button (stays open for several items)
    ============================================================ */

    function cartQtyTotal() {
      return cart.reduce(
        (sum, item) => sum + safeNumber(item.quantity), 0
      );
    }


    function handleScannedCode(rawCode) {

      const code =
        String(rawCode || '').trim().toLowerCase();

      if (!code) {
        return false;
      }

      const product =
        allProducts.find(
          p =>
            p.barcode &&
            String(p.barcode).trim().toLowerCase() === code
        );

      if (!product) {

        Scanner.beep(false);

        Scanner.toast(
          `No product with barcode ${rawCode}`,
          'error'
        );

        return false;
      }

      const before = cartQtyTotal();

      addToCart(product.id);   // shows its own alert if out of stock

      if (cartQtyTotal() > before) {

        Scanner.beep(true);

        Scanner.toast(`Added: ${product.name}`);

        return true;
      }

      Scanner.beep(false);

      return false;
    }


    function openCameraScanner() {

      Scanner.openCamera({
        title: 'Scan items to add to sale',
        continuous: true,
        onCode: handleScannedCode
      });
    }


    Scanner.listenHardware(
      handleScannedCode,
      { allowInputIds: ['product-search'] }
    );


    /* ============================================================
       ADD TO CART
    ============================================================ */

    function addToCart(productId) {

      console.log(
        'Add clicked:',
        productId
      );


      const product =
        allProducts.find(
          p =>
            String(p.id) ===
            String(productId)
        );


      if (!product) {

        console.error(
          'Product not found:',
          productId
        );


        alert(
          'Unable to add this product. Please refresh the POS.'
        );


        return;
      }


      const stock =
        safeNumber(
          product.stock_quantity,
          0
        );


      if (stock <= 0) {

        alert(
          `❌ ${product.name} is out of stock.`
        );


        return;
      }


      const existing =
        cart.find(
          item =>
            String(item.product.id) ===
            String(productId)
        );


      const currentCartQty =
        existing
          ? safeNumber(existing.quantity)
          : 0;


      if (currentCartQty >= stock) {

        alert(
          `Not enough stock available. Only ${stock} item(s) left.`
        );


        return;
      }


      if (existing) {

        existing.quantity += 1;

      } else {

        cart.push({
          product,
          quantity: 1
        });

      }


      renderCart();
    }


    /* ============================================================
       CHANGE QUANTITY
    ============================================================ */

    function changeQuantity(index, delta) {

      const item =
        cart[index];


      if (!item) {
        return;
      }


      const newQty =
        safeNumber(item.quantity) +
        safeNumber(delta);


      if (newQty <= 0) {

        cart.splice(index, 1);

        renderCart();

        return;
      }


      const stock =
        safeNumber(
          item.product.stock_quantity,
          0
        );


      if (newQty > stock) {

        alert(
          `Not enough stock available. Only ${stock} item(s) left.`
        );


        return;
      }


      item.quantity =
        newQty;


      renderCart();
    }


    /* ============================================================
       TOTALS
    ============================================================ */

    function getSubtotal() {

      return cart.reduce(
        (sum, item) =>
          sum +
          safeNumber(item.product.price) *
          safeNumber(item.quantity),
        0
      );
    }


    function getDiscount() {

      const input =
        document.getElementById(
          'discount-amount'
        );


      const value =
        parseFloat(input?.value);


      return Number.isFinite(value) &&
        value >= 0
        ? value
        : 0;
    }


    function getMarkup() {

      const input =
        document.getElementById(
          'markup-amount'
        );


      const value =
        parseFloat(input?.value);


      return Number.isFinite(value) &&
        value >= 0
        ? value
        : 0;
    }


    /* ============================================================
       CART
    ============================================================ */

    function renderCart() {

      const el =
        document.getElementById(
          'cart-items'
        );


      if (!el) {
        return;
      }


      if (!cart.length) {

        el.innerHTML =
          '<div class="empty-state">Cart is empty</div>';

        el.innerHTML =

                align-items:center;
                gap:8px;
                padding:6px 0;

              "

              <div>

                <div
                  style="
                    font-weight:600;
                    font-size:0.9rem;
                  "
                >
                  ${escapeHtml(
                    item.product.name
                  )}
                </div>

                <div
                  style="
                    font-size:0.75rem;
                    color:var(--muted);
                  "
                >
                  Ksh ${safeNumber(
                    item.product.price
                  ).toLocaleString()} each
                </div>

              </div>


              <div
                style="
                  display:flex;

                "
              >

                  type="button"

                >
                  −
                </button>


                <span>
                  ${item.quantity}
                </span>


                <button
                  type="button"
                  class="secondary"
                  style="padding:2px 8px;"
                  onclick="changeQuantity(${i}, 1)"
                >
                  +
                </button>

              </div>

            </div>

          `).join('');
      }


      updateTotals();
    }


    /* ============================================================
       UPDATE TOTALS
    ============================================================ */

    function updateTotals() {

      const subtotal =
        getSubtotal();


      const discount =
        Math.min(
          getDiscount(),
          subtotal
        );


      const markup =
        getMarkup();


      const total =
        Math.max(
          0,
          subtotal -
          discount +
          markup
        );


      document.getElementById(
        'cart-subtotal'
      ).textContent =
        `Ksh ${subtotal.toLocaleString()}`;


      document.getElementById(
        'cart-discount'
      ).textContent =
        `− Ksh ${discount.toLocaleString()}`;


      document.getElementById(
        'cart-markup'
      ).textContent =
        `+ Ksh ${markup.toLocaleString()}`;


      document.getElementById(
        'cart-total'
      ).textContent =
        `Ksh ${total.toLocaleString()}`;
    }


    document
      .getElementById('discount-amount')
      .addEventListener(
        'input',
        updateTotals
      );


    document
      .getElementById('markup-amount')
      .addEventListener(
        'input',
        updateTotals
      );

            HELD_SALES_KEY
          )
        ) || [];

      } catch (error) {

        console.error(

    function saveHeldSales(list) {

      localStorage.setItem(

      );

    function holdSale() {

      if (!cart.length) {

        alert(
          'Cart is empty — nothing to hold.'

        return;
      }


      const customerName =
        document.getElementById(
          'customer-name'
        ).value;


      const label =
        prompt(
          'Label this held sale (e.g. customer name):',
          customerName || 'Held sale'
        );


      if (label === null) {
        return;
      }


      const held =
        getHeldSales();


      held.push({

        id: Date.now(),

        label,

        cart:

            productId:
              item.product.id,

            quantity:
              item.quantity
          })),

        discount:
          getDiscount(),

        markup:
          getMarkup(),

        customerName:
          customerName,

        customerPhone:
          document.getElementById(
            'customer-phone'
          ).value,

        heldAt:
          new Date().toISOString()

      saveHeldSales(held);

      clearCurrentSale();

      renderHeldSales();
    }

    function resumeSale(holdId) {

      if (
        cart.length &&
        !confirm(
          'This will replace your current cart. Continue?'
        )
      ) {
        return;
      }


      const held =
        getHeldSales();


      const entry =
        held.find(
          h =>
            Number(h.id) ===
            Number(holdId)
        );


      if (!entry) {
        return;
      }


      cart =
        entry.cart
          .map(ci => {

            const product =
              allProducts.find(
                p =>
                  String(p.id) ===
                  String(ci.productId)
              );


            if (!product) {
              return null;
            }


            const stock =
              safeNumber(
                product.stock_quantity,
                0
              );


            const quantity =
              Math.min(
                safeNumber(ci.quantity, 1),
                stock
              );


            if (quantity <= 0) {
              return null;
            }


            return {
              product,
              quantity
            };

          })
          .filter(Boolean);


      document.getElementById(
        'discount-amount'
      ).value =
        entry.discount || 0;


      document.getElementById(
        'markup-amount'
      ).value =
        entry.markup || 0;


      document.getElementById(
        'customer-name'
      ).value =
        entry.customerName || '';


      document.getElementById(
        'customer-phone'
      ).value =
        entry.customerPhone || '';


      saveHeldSales(
        held.filter(
          h =>
            Number(h.id) !==
            Number(holdId)
        )
      );


      renderCart();

      renderHeldSales();
    }


    function discardHeldSale(holdId) {

      if (
        !confirm(
          'Discard this held sale?'
        )
      ) {
        return;
      }


      saveHeldSales(
        getHeldSales().filter(
          h =>
            Number(h.id) !==
            Number(holdId)
        )
      );


      renderHeldSales();
    }

    function normalizePaymentMethod(ui) {
      if (ui.startsWith('paybill')) return 'paybill';
      if (ui.startsWith('pochi')) return 'pochi';
      return ui;
    }

    function payModal({ title, msg, showCode = false, buttons = [] }) {
      document.getElementById('pay-title').textContent = title;
      document.getElementById('pay-msg').textContent = msg || '';
      document.getElementById('pay-code-box').style.display = showCode ? 'block' : 'none';
      payError('');

      const actions = document.getElementById('pay-actions');
      actions.innerHTML = '';
      buttons.forEach(b => {
        const el = document.createElement('button');
        el.type = 'button';
        el.textContent = b.label;
        el.style.flex = '1';
        if (b.cls) el.className = b.cls;
        el.onclick = b.handler;
        actions.appendChild(el);
      });

      document.getElementById('pay-overlay').style.display = 'block';
      document.getElementById('pay-panel').style.display = 'block';
    }

    function payError(text) {
      const el = document.getElementById('pay-error');
      el.textContent = text;
      el.style.display = text ? 'block' : 'none';
    }

    function closePayModal() {
      document.getElementById('pay-overlay').style.display = 'none';
      document.getElementById('pay-panel').style.display = 'none';
    }

    async function fnErrorMessage(error, data) {
      if (data && data.error) return data.error;
      try { const b = await error.context.json(); return b.error || error.message; }
      catch (_) { return error.message; }
    }

    /*
     * Paybill STK flow. The sale already exists as 'pending'.
     * Resolves { ok:true, receipt } or { ok:false, message }.
     */
    async function runStkFlow(saleId, phone, total) {

      payModal({
        title: 'Sending M-Pesa prompt…',
        msg: `Requesting Ksh ${total.toLocaleString()} from ${phone}`
      });

      const { data, error } =
        await supabaseClient.functions.invoke('mpesa-stk-push', {
          body: { sale_id: saleId, phone }
        });

      if (error || (data && data.error)) {
        await supabaseClient.rpc('void_pending_sale', { p_sale_id: saleId });
        closePayModal();
        return {
          ok: false,
          message: 'Could not send the M-Pesa prompt: ' + (await fnErrorMessage(error, data))
        };
      }

      return new Promise((resolve) => {

        let startedAt = Date.now();
        let timedOut = false;
        let finished = false;
        let timer = null;

        const finish = (result) => {
          if (finished) return;
          finished = true;
          clearInterval(timer);
          closePayModal();
          resolve(result);
        };

        const readSale = async () => {
          const { data: s } = await supabaseClient
            .from('sales').select('status, mpesa_receipt').eq('id', saleId).single();
          return s;
        };

        const cancelSale = async () => {
          await supabaseClient.rpc('void_pending_sale', { p_sale_id: saleId });
          const s = await readSale();   // the customer may have paid in the same second
          if (s && s.status === 'completed') {
            finish({ ok: true, receipt: s.mpesa_receipt });
          } else {
            finish({
              ok: false,
              message: 'Sale cancelled and stock restored. If the customer says they already paid, ' +
                       'get their M-Pesa code and use "Paybill — customer already paid".'
            });
          }
        };

        const resendInstructions = () => {
          const text = buildPaymentInstructions('paybill', total);
          if (phone) openWhatsappWith(phone, text); else copyToClipboard(text);
        };

        const showWaiting = () => {
          timedOut = false;
          startedAt = Date.now();
          payModal({
            title: 'Waiting for customer…',
            msg: `Ask the customer to check their phone and enter their M-Pesa PIN. Amount: Ksh ${total.toLocaleString()}`,
            buttons: [
              { label: '📱 Resend on WhatsApp', handler: resendInstructions },
              { label: 'Cancel sale', cls: 'secondary', handler: cancelSale }
            ]
          });
        };

        const showTimedOut = () => {
          timedOut = true;
          payModal({
            title: 'No response yet',
            msg: 'The customer has not paid yet. The prompt may have been missed or their phone may be off.',
            buttons: [
              { label: '📱 Send instructions', handler: resendInstructions },
              { label: 'Keep waiting', handler: showWaiting },
              { label: 'Cancel sale', cls: 'secondary', handler: cancelSale }
            ]
          });
        };

        showWaiting();

        timer = setInterval(async () => {
          const s = await readSale();
          if (!s) return;
          if (s.status === 'completed') {
            finish({ ok: true, receipt: s.mpesa_receipt });
          } else if (s.status === 'void') {
            finish({
              ok: false,
              message: 'The payment was cancelled, declined or timed out on the customer\'s phone. Stock restored — you can try again.'
            });
          } else if (!timedOut && Date.now() - startedAt > 90000) {
            showTimedOut();
          }
        }, 3000);
      });
    }

    /*
     * Code-entry flow (Paybill already paid / Pochi).
     * Resolves { code, verified } or null if the cashier backs out.
     */
    function collectMpesaCode(channel, total, phone) {

      const isPochi = channel === 'pochi';
      const canOverride = ['admin', 'manager'].includes(currentStaff?.role);

      return new Promise((resolve) => {

        const cancel = () => { closePayModal(); resolve(null); };

        const reasons = {
          not_found: 'Payment not found yet. It can take a few seconds to arrive — try again shortly.',
          already_used: 'This M-Pesa code has already been used for another sale.',
          too_old: 'This payment is more than 24 hours old and cannot be used for a new sale.',
          not_logged_in: 'Session expired. Please log in again.'
        };

        const sendInstructions = () => {
          const text = buildPaymentInstructions(channel, total);
          if (phone) openWhatsappWith(phone, text); else copyToClipboard(text);
        };

        const buildDialog = (overrideOffered) => {
          const buttons = [
            { label: phone ? '📱 Send pay details' : '📋 Copy pay details', cls: 'secondary', handler: sendInstructions },
            { label: 'Verify payment', handler: submit },
            { label: 'Cancel', cls: 'secondary', handler: cancel }
          ];
          if (overrideOffered) {
            buttons.splice(1, 0, {
              label: 'Record unverified',
              cls: 'danger',
              handler: () => {
                const code = document.getElementById('pay-code').value.trim().toUpperCase();
                if (!confirm('Record this sale WITHOUT system confirmation? It will be flagged for the owner to check.')) return;
                closePayModal();
                resolve({ code, verified: false });
              }
            });
          }
          const keep = document.getElementById('pay-code').value;
          payModal({
            title: isPochi ? 'Pochi la Biashara payment' : 'Paybill payment',
            msg: `Enter the M-Pesa code from the customer's confirmation message. Amount due: Ksh ${total.toLocaleString()}.` +
                 (isPochi ? ' Also confirm the money in the Pochi balance before handing over goods.' : ''),
            showCode: true,
            buttons
          });
          document.getElementById('pay-code').value = keep;
        };

        async function submit() {
          const code = document.getElementById('pay-code').value.trim().toUpperCase();
          if (!/^[A-Z0-9]{10}$/.test(code)) {
            payError('An M-Pesa code is 10 letters/numbers, e.g. UI12ABC345.');
            return;
          }
          payError('Checking…');

          const { data, error } = await supabaseClient.rpc('verify_mpesa_code', {
            p_code: code, p_channel: channel, p_total: total
          });

          if (error) { payError('Could not verify: ' + error.message); return; }

          if (data.ok) {
            closePayModal();
            resolve({ code, verified: true });
            return;
          }

          let msg = reasons[data.reason] || 'Could not verify this payment.';
          if (data.reason === 'underpaid') {
            msg = `Customer paid Ksh ${Number(data.amount).toLocaleString()} but the total is Ksh ${total.toLocaleString()}.`;
          } else if (data.reason === 'wrong_channel') {
            msg = `This code was paid to ${data.channel === 'pochi' ? 'Pochi la Biashara' : 'the Paybill'}, not ${isPochi ? 'Pochi' : 'Paybill'}. Pick the matching payment method.`;
          }
          const offerOverride = data.reason === 'not_found' && canOverride;
          if (data.reason === 'not_found' && !canOverride) {
            msg += ' If it still does not appear, ask a manager to record it.';
          }
          buildDialog(offerOverride);
          payError(msg);
        }

        buildDialog(false);
        document.getElementById('pay-code').value = '';
        document.getElementById('pay-code').focus();
      });
    }


    async function checkout() {

      const errorEl =
        document.getElementById(
          'checkout-error'
        );


      errorEl.style.display =
        'none';


      if (!cart.length) {

        errorEl.textContent =
          'Cart is empty.';

        errorEl.style.display =
          'block';

        return;
      }


      if (!currentStaff?.id) {

        errorEl.textContent =
          'Staff session is not available. Please log in again.';

        errorEl.style.display =
          'block';

        return;
      }


      const btn =
        document.getElementById(
          'checkout-btn'
        );


      btn.disabled = true;

      btn.textContent =
        'Processing...';


      const subtotal =
        getSubtotal();


      const discount =
        Math.min(
          getDiscount(),
          subtotal
        );


      const markup =
        getMarkup();


      const total =
        Math.max(
          0,
          subtotal -
          discount +
          markup
        );


      const paymentUi =
        document.getElementById(
          'payment-method'
        ).value;

      // 'paybill_stk' / 'paybill_code' -> 'paybill', 'pochi_code' -> 'pochi'
      const paymentMethod =
        normalizePaymentMethod(paymentUi);


      const customerName =
        document.getElementById(
          'customer-name'
        ).value.trim() || null;


      const customerPhone =
        document.getElementById(
          'customer-phone'
        ).value.trim() || null;


      const saleItems =
        cart.map(item => ({

          product_id:
            item.product.id,

          unit_price:
            safeNumber(
              item.product.price
            ),

          quantity:
            safeNumber(
              item.quantity
            )

        }));


      /*
       * M-PESA (Paybill / Pochi) pre-checks.
       * These need internet, so they are not queued offline.
       */
      const isMpesa =
        paymentMethod === 'paybill' ||
        paymentMethod === 'pochi';

      let saleStatus = 'completed';
      let mpesaReceipt = null;
      let paymentVerified = true;

      const abortCheckout = (message) => {

        if (message) {
          errorEl.textContent = message;
          errorEl.style.display = 'block';
        }

        btn.disabled = false;
        btn.textContent = 'Complete Sale';
      };

      if (isMpesa) {

        if (!navigator.onLine) {
          abortCheckout('M-Pesa payments need an internet connection. Reconnect, or take cash.');
          return;
        }

        if (paymentUi === 'paybill_stk') {

          const digits = (customerPhone || '').replace(/\D/g, '');

          if (!/^(254|0)?[17]\d{8}$/.test(digits)) {
            abortCheckout('Enter the customer\'s Safaricom number (07XXXXXXXX) to send the M-Pesa prompt.');
            return;
          }

          saleStatus = 'pending';

        } else {

          const result = await collectMpesaCode(paymentMethod, total, customerPhone);

          if (!result) {
            abortCheckout('');
            return;
          }

          mpesaReceipt = result.code;
          paymentVerified = result.verified;
        }
      }


      const saleData = {

        cashier_id:
          currentStaff.id,

        customer_name:
          customerName,

        customer_phone:
          customerPhone,

        payment_method:
          paymentMethod,

        total_amount:
          total,

        subtotal_amount:
          subtotal,

        discount_amount:
          discount,

        markup_amount:
          markup,

        status:
          saleStatus,

        ...(mpesaReceipt
          ? { mpesa_receipt: mpesaReceipt }
          : {}),

        ...(paymentVerified
          ? {}
          : { payment_verified: false }),

        items:
          saleItems
      };


      const receiptItems =
        cart.map(item => ({

          name:
            item.product.name,

          quantity:
            item.quantity,

          price:
            safeNumber(
              item.product.price
            )

        }));


      let successfulOnlineSale = false;


      try {

        if (!navigator.onLine) {
          throw new Error('offline');
        }


        const {
          items,
          ...saleFields
        } = saleData;


        /* INSERT SALE */
        const {
          data: insertedSale,
          error: saleError
        } =
          await supabaseClient
            .from('sales')
            .insert(saleFields)
            .select()
            .single();


        if (saleError) {
          throw saleError;
        }


        if (!insertedSale?.id) {
          throw new Error(
            'Sale was created without a sale ID.'
          );
        }


        /* INSERT SALE ITEMS */
        const itemsToInsert =
          items.map(item => ({
            ...item,
            sale_id:
              insertedSale.id
          }));


        const {
          error: itemsError
        } =
          await supabaseClient
            .from('sale_items')
            .insert(itemsToInsert);


        if (itemsError) {
          throw itemsError;
        }


        /*
         * UPDATE STOCK
         */
        for (const item of items) {

          const product =
            allProducts.find(
              p =>
                String(p.id) ===
                String(item.product_id)
            );


          if (!product) {
            continue;
          }


          const currentStock =
            safeNumber(
              product.stock_quantity,
              0
            );


          const newQty =
            Math.max(
              0,
              currentStock -
              safeNumber(
                item.quantity
              )
            );


          const {
            error: stockError
          } =
            await supabaseClient
              .from('products')
              .update({
                stock_quantity:
                  newQty
              })
              .eq(
                'id',
                item.product_id
              );


          if (stockError) {

            console.error(
              'Stock update failed:',
              stockError
            );

          } else {

            product.stock_quantity =
              newQty;
          }
        }


        /*
         * PAYBILL PROMPT: the sale is saved as 'pending' with stock reserved.
         * Wait for the customer to pay. If they don't, the sale is voided
         * and the stock is restored by the database.
         */
        if (saleStatus === 'pending') {

          const outcome =
            await runStkFlow(
              insertedSale.id,
              customerPhone,
              total
            );

          if (!outcome.ok) {

            await loadProducts();

            abortCheckout(outcome.message);

            return;
          }

          mpesaReceipt = outcome.receipt;
        }


        successfulOnlineSale = true;


        /*
         * Immediately refresh the POS.
         */
        applyProductFilters();

        updateLowStockBanner();


        showReceipt({

          items:
            receiptItems,

          subtotal,

          discount,

          markup,

          total,

          paymentMethod,

          mpesaReceipt,

          customerName,

          customerPhone,

          date:
            new Date()

        });


      } catch (err) {

        console.warn(
          'Online checkout failed:',
          err
        );


        if (isMpesa) {

          // M-Pesa sales are never queued offline.
          await loadProducts();

          abortCheckout(
            err && err.code === '23505'
              ? 'That M-Pesa code has already been used for another sale.'
              : 'M-Pesa sale could not be completed: ' +
                ((err && err.message) || 'unknown error')
          );

          return;
        }


        try {

          await queueSaleOffline(
            saleData
          );


          showReceipt({

            items:
              receiptItems,

            subtotal,

            discount,

            markup,

            total,

            paymentMethod,

            customerName,

            customerPhone,

            date:
              new Date(),

            offline:
              true

          });


          const pending =
            await getPendingSales();


          updateSyncBadge(
            pending.length
          );

        } catch (queueError) {

          console.error(
            'Unable to queue sale:',
            queueError
          );


          errorEl.textContent =
            'Sale could not be completed. Please try again.';

          errorEl.style.display =
            'block';


          btn.disabled =
            false;

          btn.textContent =
            'Complete Sale';

          return;
        }
      }


      /*
       * Clear sale only after successful
       * online checkout or offline queue.
       */
      if (
        successfulOnlineSale ||
        !navigator.onLine
      ) {

        clearCurrentSale();
      }


      btn.disabled =
        false;

      btn.textContent =
        'Complete Sale';


      /*
       * Reload current stock.
       */
      if (successfulOnlineSale) {

        await loadProducts();

      } else {

        applyProductFilters();

        updateLowStockBanner();
      }
    }


    /* ============================================================
       RECEIPT
    ============================================================ */

    function showReceipt(data) {

      lastReceiptData =
        data;


      const shopName =
        'Thuku Enterprise';


      const lines =
        data.items
          .map(item => {

            const lineTotal =
              safeNumber(item.price) *
              safeNumber(item.quantity);


            return (
              `${item.name} x${item.quantity}`
                .padEnd(28) +
              `Ksh ${lineTotal.toLocaleString()}`
            );

          })
          .join('\n');


      document.getElementById(
        'receipt-content'
      ).innerHTML = `

        <div
          style="
            text-align:center;
            margin-bottom:10px;
          "
        >

          <strong
            style="font-size:1rem;"
          >
            ${escapeHtml(shopName)}
          </strong>

          <br>

          <span
            style="
              font-size:0.75rem;
              color:var(--muted);
            "
          >
            ${data.date.toLocaleString(
              'en-KE',
              {
                dateStyle:'medium',
                timeStyle:'short'
              }
            )}
          </span>

        </div>


        <div
          style="
            border-top:1px dashed var(--border);
            border-bottom:1px dashed var(--border);
            padding:8px 0;
            margin:8px 0;
            white-space:pre-wrap;
          "
        >
          ${escapeHtml(lines)}
        </div>


        <div
          style="
            display:flex;
            justify-content:space-between;
          "
        >
          <span>Subtotal</span>

          <span>
            Ksh ${data.subtotal.toLocaleString()}
          </span>
        </div>


        ${
          data.discount > 0
            ? `
              <div
                style="
                  display:flex;
                  justify-content:space-between;
                "
              >
                <span>Discount</span>

                <span>
                  − Ksh ${data.discount.toLocaleString()}
                </span>
              </div>
            `
            : ''
        }


        ${
          data.markup > 0
            ? `
              <div
                style="
                  display:flex;
                  justify-content:space-between;
                "
              >
                <span>Markup</span>

                <span>
                  + Ksh ${data.markup.toLocaleString()}
                </span>
              </div>
            `
            : ''
        }


        <div
          style="
            display:flex;
            justify-content:space-between;
            font-weight:700;
            margin-top:4px;
          "
        >
          <span>TOTAL</span>

          <span>
            Ksh ${data.total.toLocaleString()}
          </span>
        </div>


        <div
          style="
            margin-top:8px;
            font-size:0.8rem;
            color:var(--muted);
          "
        >
          Payment:
          ${escapeHtml(data.paymentMethod)}
        </div>

        ${
          data.mpesaReceipt
            ? `
              <div
                style="
                  font-size:0.8rem;
                  color:var(--muted);
                "
              >
                M-Pesa code:
                ${escapeHtml(data.mpesaReceipt)}
              </div>
            `
            : ''
        }


        ${
          data.customerName
            ? `
              <div
                style="
                  font-size:0.8rem;
                  color:var(--muted);
                "
              >
                Customer:
                ${escapeHtml(data.customerName)}
              </div>
            `
            : ''
        }


        ${
          data.customerPhone
            ? `
              <div
                style="
                  font-size:0.8rem;
                  color:var(--muted);
                "
              >
                Phone:
                ${escapeHtml(data.customerPhone)}
              </div>
            `
            : ''
        }


        ${
          data.offline
            ? `
              <div
                style="
                  margin-top:8px;
                  color:var(--gold);
                  font-size:0.8rem;
                "
              >
                ⚠️ Saved offline —
                will sync when back online.
              </div>
            `
            : ''
        }


        <div
          style="
            text-align:center;
            margin-top:12px;
            font-size:0.8rem;
            color:var(--muted);
          "
        >
          Thank you for your business!
        </div>

      `;


      document.getElementById(
        'receipt-overlay'
      ).style.display =
        'block';


      document.getElementById(
        'receipt-panel'
      ).style.display =
        'block';
    }


    function closeReceipt() {

      document.getElementById(
        'receipt-overlay'
      ).style.display =
        'none';


      document.getElementById(
        'receipt-panel'
      ).style.display =
        'none';
    }


    /* ============================================================
       PRINT
    ============================================================ */

    function printReceipt() {

      const content =
        document.getElementById(
          'receipt-content'
        ).innerHTML;


      const printWindow =
        window.open(
          '',
          '_blank'
        );


      if (!printWindow) {

        alert(
          'Please allow pop-ups to print the receipt.'
        );

        return;
      }


      printWindow.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

          <title>
            Thuku Enterprise Receipt
          </title>

          <style>

            body {
              font-family:'Courier New',monospace;
              font-size:13px;
              padding:20px;
            }

          </style>

        </head>

        <body>

          ${content}

        </body>

        </html>

      `);


      printWindow.document.close();

      printWindow.focus();

      printWindow.print();
    }


    /* ============================================================
       WHATSAPP
    ============================================================ */

    function shareReceiptWhatsapp() {

      if (!lastReceiptData) {
        return;
      }


      const data =
        lastReceiptData;


      const lines =
        data.items
          .map(item =>
            `${item.name} x${item.quantity} - Ksh ${(
              safeNumber(item.price) *
              safeNumber(item.quantity)
            ).toLocaleString()}`
          )
          .join('\n');


      let text =
        `*Thuku Enterprise Receipt*\n` +
        `${data.date.toLocaleString('en-KE')}\n\n` +
        `${lines}\n\n` +
        `Subtotal: Ksh ${data.subtotal.toLocaleString()}`;


      if (data.discount > 0) {

        text +=
          `\nDiscount: -Ksh ${data.discount.toLocaleString()}`;
      }


      if (data.markup > 0) {

        text +=
          `\nMarkup: +Ksh ${data.markup.toLocaleString()}`;
      }


      text +=
        `\n*TOTAL: Ksh ${data.total.toLocaleString()}*` +
        `\n\nThank you for your business!`;


      const phone =
        data.customerPhone
          ? data.customerPhone.replace(/\D/g, '')
          : '';


      let normalizedPhone =
        phone;


      /*
       * Kenyan mobile number:
       * 07XXXXXXXX -> 2547XXXXXXXX
       * 01XXXXXXXX -> 2541XXXXXXXX
       */
      if (
        normalizedPhone.startsWith('0') &&
        normalizedPhone.length === 10
      ) {

        normalizedPhone =
          '254' +
          normalizedPhone.slice(1);
      }


      const waUrl =
        normalizedPhone
          ? `https://wa.me/${normalizedPhone}?text=${encodeURIComponent(text)}`
          : `https://wa.me/?text=${encodeURIComponent(text)}`;


      window.open(
        waUrl,
        '_blank'
      );
    }


    /* ============================================================
       HTML ESCAPE
    ============================================================ */

    function escapeHtml(value) {

      const div =
        document.createElement('div');


      div.textContent =
        value ?? '';


      return div.innerHTML;
    }


    /* ============================================================
       ONLINE / OFFLINE REFRESH
    ============================================================ */

    window.addEventListener(
      'online',
      async () => {

        console.log(
          'POS is back online.'
        );


        try {

          await loadProducts();

          updateLowStockBanner();

        } catch (error) {

          console.error(
            'Failed to refresh products after reconnect:',
            error
          );
        }
      }
    );


    window.addEventListener(
      'offline',
      () => {

        console.log(
          'POS is offline.'
        );

        /*
         * Cached products can still be used.
         */
        updateLowStockBanner();

      }
    );


    /* ============================================================
       FINAL LOW-STOCK CHECK
    ============================================================ */

    window.addEventListener(
      'load',
      () => {

        setTimeout(
          () => {
            updateLowStockBanner();
          },
          500
        );

      }
    );

  </script>
